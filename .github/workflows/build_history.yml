name: Build 5-Year History Benchmark DB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Build benchmark DB
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: python build_history_benchmark.py --start 202201 --end 202610

      - name: Commit and push benchmark DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "feat: 2022-2026 5-year ATH benchmark DB [skip ci]" || exit 0
          git push
