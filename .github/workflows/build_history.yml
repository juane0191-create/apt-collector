name: Build 5-Year History Benchmark DB

on:
workflow_dispatch:

permissions:
contents: write

jobs:
build-db:
runs-on: ubuntu-latest
steps:
- name: 저장소 체크아웃
uses: actions/checkout@v4

  - name: 파이썬 준비
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: 필수 라이브러리 설치
    run: pip install pandas requests

  - name: 5개년 장기 벤치마크 DB 구축 실행
    env:
      MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
    run: |
      python build_history_benchmark.py --start 202201 --end 202610

  - name: 완성된 벤치마크 기준표 깃허브에 저장
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "actions@github.com"
      git add data/
      git commit -m "feat: 2022-2026 5개년 역대 전고점 벤치마크 DB 구축 완료 [skip ci]" || exit 0
      git push
