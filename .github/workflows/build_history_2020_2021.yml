name: Build History Benchmark (2020-2021)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db-2020-2021:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch 2020-2021 Real Estate Data & Merge ATH
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: python build_history_benchmark.py --start 202001 --end 202112

      - name: Commit and push updated benchmark DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "feat: add 2020-2021 historical ATH to benchmark DB [skip ci]" || exit 0
          git push
