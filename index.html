<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수도권 25개 구역 실거래가 & 2020~2022 전고점 분석</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
    .tab-active { background-color: #1e293b; color: #ffffff; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur text-white border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-building-circle-check text-xl"></i></div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">수도권 25개 구역 아파트 실거래 분석</h1>
          <p class="text-xs text-slate-400">2020~2022 불장 전고점 대비 정밀 회복률 모니터링</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="last-updated" class="text-slate-300">데이터 로딩 중...</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

    <!-- Control Ribbon & Month Selector -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div id="month-tabs" class="flex flex-wrap gap-2">
        <!-- Month buttons generated dynamically -->
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <div class="relative w-full md:w-64">
          <input type="text" id="search-input" placeholder="단지명, 지역명 검색 (예: 동천자이)..." 
                 class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
        </div>
      </div>
    </div>

    <!-- Summary Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-indigo-500">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">조회 월 총 거래건수</div>
        <div id="stat-total-trades" class="text-2xl font-black text-slate-900 mt-1">-</div>
        <div class="text-xs text-slate-400 mt-1">25개 핵심 구역 합산</div>
      </div>
      <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-rose-500">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">2020~2022 전고점 돌파 단지</div>
        <div id="stat-ath-count" class="text-2xl font-black text-rose-600 mt-1">-</div>
        <div class="text-xs text-slate-400 mt-1">역대 불장 피크 경신</div>
      </div>
      <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-amber-500">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">회복률 90% 이상 육박</div>
        <div id="stat-near-ath-count" class="text-2xl font-black text-amber-600 mt-1">-</div>
        <div class="text-xs text-slate-400 mt-1">전고점 턱밑 추격 구간</div>
      </div>
      <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-emerald-500">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">평균 전고점 회복률</div>
        <div id="stat-avg-recovery" class="text-2xl font-black text-emerald-600 mt-1">- %</div>
        <div class="text-xs text-slate-400 mt-1">2020~2022 peak 기준</div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left 2 Cols: Real-time Deals List -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h2 id="section-title" class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i> 실거래 및 전고점 분석 목록
          </h2>
          <span id="item-count" class="text-xs font-medium bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">0건</span>
        </div>

        <div id="cards-container" class="space-y-4">
          <!-- Transaction cards inserted here -->
        </div>
      </div>

      <!-- Right 1 Col: Benchmark DB Fast Explorer & Region Stats -->
      <div class="space-y-6">
        
        <!-- 2020~2022 ATH Top 10 Benchmark Widget -->
        <div class="glass-card p-5 rounded-2xl shadow-sm">
          <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center justify-between">
            <span><i class="fa-solid fa-trophy text-amber-500 mr-2"></i>2020~2022 최고가 대장주 TOP 10</span>
          </h3>
          <p class="text-xs text-slate-500 mb-4">2020~2022 불장 당시 최고가를 기록했던 25개 구역 랜드마크 기준표</p>
          <div id="benchmark-top-list" class="space-y-3 text-xs">
            <!-- Top benchmark list items -->
          </div>
        </div>

        <!-- Regional Distribution Chart -->
        <div class="glass-card p-5 rounded-2xl shadow-sm">
          <h3 class="text-base font-bold text-slate-900 mb-4"><i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i>지역별 거래 비중</h3>
          <div class="h-64">
            <canvas id="regionChart"></canvas>
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative space-y-4">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div id="modal-content">
        <!-- Modal body rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    let globalData = null;
    let benchmarkMap = new Map(); // 2020-2022 ATH Benchmark DB Map
    let benchmarkList = [];
    let currentMonth = "";
    let regionChartObj = null;

    // -------------------------------------------------------------
    // [핵심 정규화 및 소수점 무시 로직]
    // 1. 단지명: 띄어쓰기, 특수문자 제거 후 소문자 변환 ("동천 자이" -> "동천자이")
    // 2. 전용면적: 소수점 자리를 완전히 버리고 정수(Math.floor)만 추출 (84.97㎡ -> 84, 84.12㎡ -> 84)
    // -------------------------------------------------------------
    function normalizeAptName(name) {
      if (!name) return "";
      return name.replace(/\s+/g, '').replace(/[\(\)\-\_\,\.]/g, '').toLowerCase();
    }

    function getIntegerArea(area) {
      const num = parseFloat(area);
      if (isNaN(num)) return 84;
      return Math.floor(num); // 소수점 무시하고 정수 부분만 추출
    }

    function makeKey(aptName, area, regionName) {
      const normApt = normalizeAptName(aptName);
      const intArea = getIntegerArea(area);
      const normRegion = normalizeAptName(regionName || '');
      return `${normApt}_${intArea}_${normRegion}`;
    }

    // 1. Page Initializer & Fetch Data
    async function init() {
      try {
        await loadBenchmarkDB();
        
        const resp = await fetch(`data/daily_briefing_data.json?t=${new Date().getTime()}`);
        if (!resp.ok) throw new Error("JSON load failed");
        globalData = await resp.json();

        document.getElementById("last-updated").textContent = `최근 업데이트: ${globalData.lastUpdated || '수동집계'}`;

        if (globalData.availableMonths && globalData.availableMonths.length > 0) {
          setupMonthTabs(globalData.availableMonths);
          selectMonth(globalData.availableMonths[0]);
        }
      } catch (err) {
        console.error("Init Error:", err);
        document.getElementById("cards-container").innerHTML = `
          <div class="p-8 text-center bg-white rounded-2xl border border-rose-200 text-rose-600">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p class="font-bold">데이터를 불러오는 중 오류가 발생했습니다.</p>
            <p class="text-xs text-slate-500 mt-1">data/daily_briefing_data.json 및 data/history_ath_benchmark.csv 생성 여부를 확인하세요.</p>
          </div>`;
      }
    }

    // 2. Load 2020-2022 ATH Benchmark CSV
    async function loadBenchmarkDB() {
      try {
        const resp = await fetch(`data/history_ath_benchmark.csv?t=${new Date().getTime()}`);
        if (!resp.ok) return;
        const csvText = await resp.text();
        parseBenchmarkCSV(csvText);
      } catch (e) {
        console.warn("Benchmark CSV not loaded:", e);
      }
    }

    function parseBenchmarkCSV(csvText) {
      const lines = csvText.split('\n');
      if (lines.length < 2) return;
      
      const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
      
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split(',').map(r => r.trim().replace(/"/g, ''));
        
        const item = {};
        headers.forEach((h, idx) => item[h] = row[idx]);

        const dealDate = item["최고가계약일"] || "";
        const year = parseInt(dealDate.substring(0, 4));

        // 2020 ~ 2022년 불장 기간 최고가 데이터만 벤치마크 기준표로 바인딩
        if (year >= 2020 && year <= 2022) {
          const apt = item["아파트"];
          const rawArea = item["전용면적"] || "84";
          const region = item["지역명"] || "";
          const price = parseFloat(item["역대최고가_억"]) || 0;

          // 소수점을 무시한 정밀 키 생성
          const primaryKey = makeKey(apt, rawArea, region);

          if (!benchmarkMap.has(primaryKey) || price > benchmarkMap.get(primaryKey).price) {
            const benchObj = {
              apt: apt,
              area: rawArea,
              intArea: getIntegerArea(rawArea),
              region: region,
              price: price,
              date: dealDate,
              floor: item["최고가층"] || "중층"
            };
            benchmarkMap.set(primaryKey, benchObj);
            benchmarkList.push(benchObj);
          }
        }
      }

      // 내림차순 정렬
      benchmarkList.sort((a, b) => b.price - a.price);
      renderTopBenchmarkWidget();
    }

    // 3. Render Top 10 Benchmark Sidebar
    function renderTopBenchmarkWidget() {
      const container = document.getElementById("benchmark-top-list");
      if (benchmarkList.length === 0) {
        container.innerHTML = `<div class="text-slate-400">2020~2022 벤치마크 로딩 중...</div>`;
        return;
      }

      const top10 = benchmarkList.slice(0, 10);
      container.innerHTML = top10.map((item, idx) => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100 hover:bg-indigo-50/50 transition-colors">
          <div class="flex items-center gap-2.5 overflow-hidden">
            <span class="w-5 h-5 rounded-full ${idx < 3 ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-600'} flex items-center justify-center font-bold text-[10px] flex-shrink-0">${idx+1}</span>
            <div class="truncate">
              <div class="font-bold text-slate-800 truncate">${item.apt} <span class="text-[10px] text-slate-400 font-normal">(${item.intArea}㎡)</span></div>
              <div class="text-[10px] text-slate-400">${item.region} · ${item.date} (${item.floor})</div>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="font-black text-indigo-600">${item.price.toFixed(2)}억</div>
            <div class="text-[9px] text-slate-400">2020~22 peak</div>
          </div>
        </div>
      `).join('');
    }

    // 4. Setup Month Tabs
    function setupMonthTabs(months) {
      const container = document.getElementById("month-tabs");
      container.innerHTML = months.map(m => {
        const y = m.substring(0, 4);
        const mm = m.substring(4, 6);
        return `
          <button onclick="selectMonth('${m}')" id="tab-${m}" 
                  class="px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-all shadow-sm">
            ${y}년 ${parseInt(mm)}월
          </button>
        `;
      }).join('');
    }

    // 5. Select Month & Render Content
    function selectMonth(m) {
      currentMonth = m;
      document.querySelectorAll("#month-tabs button").forEach(btn => btn.classList.remove("tab-active"));
      const activeBtn = document.getElementById(`tab-${m}`);
      if (activeBtn) activeBtn.classList.add("tab-active");

      renderData();
    }

    // 6. Main Render Engine
    function renderData() {
      if (!globalData || !globalData.monthsData || !globalData.monthsData[currentMonth]) return;

      const mData = globalData.monthsData[currentMonth];
      const searchKeyword = normalizeAptName(document.getElementById("search-input").value);

      document.getElementById("stat-total-trades").textContent = `${mData.totalTradeCount || 0} 건`;

      let rawList = mData.curatedTransactions || [];
      let filtered = [];

      let athCount = 0;
      let nearAthCount = 0;
      let totalRecoveryRatio = 0;
      let validBenchmarkCount = 0;

      rawList.forEach(item => {
        const apt = item.aptName;
        const region = item.regionName;
        const area = item.area;
        const currentPrice = item.price;

        // 정규화 키 매칭 (소수점 자리를 완전히 무시하여 정수 전용면적 기반 비교)
        const matchKey = makeKey(apt, area, region);
        const benchObj = benchmarkMap.get(matchKey);

        let athPrice = benchObj ? benchObj.price : item.previousHigh;
        let athDate = benchObj ? benchObj.date : (item.previousHighDate || "2020~2022");
        let athFloor = benchObj ? benchObj.floor : "";

        let recoveryRatio = 0;
        if (athPrice && athPrice > 0) {
          recoveryRatio = (currentPrice / athPrice) * 100;
          totalRecoveryRatio += recoveryRatio;
          validBenchmarkCount++;

          if (recoveryRatio >= 100) athCount++;
          else if (recoveryRatio >= 90) nearAthCount++;
        }

        const normApt = normalizeAptName(apt);
        const normRegion = normalizeAptName(region);

        if (!searchKeyword || normApt.includes(searchKeyword) || normRegion.includes(searchKeyword)) {
          filtered.push({
            ...item,
            intArea: getIntegerArea(area),
            athPrice: athPrice,
            athDate: athDate,
            athFloor: athFloor,
            recoveryRatio: recoveryRatio
          });
        }
      });

      document.getElementById("stat-ath-count").textContent = `${athCount} 개 단지`;
      document.getElementById("stat-near-ath-count").textContent = `${nearAthCount} 개 단지`;
      document.getElementById("stat-avg-recovery").textContent = validBenchmarkCount > 0 
        ? `${(totalRecoveryRatio / validBenchmarkCount).toFixed(1)} %` : `- %`;

      document.getElementById("item-count").textContent = `${filtered.length}건 표시`;

      renderCards(filtered);
      renderChart(mData);
    }

    // 7. Render Transaction Cards with Recovery Gauge
    function renderCards(list) {
      const container = document.getElementById("cards-container");
      if (list.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center bg-white rounded-2xl border border-slate-200 text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
            <p class="font-semibold">조회된 실거래 데이터가 없습니다.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const ratio = item.recoveryRatio;
        let badgeClass = "bg-slate-100 text-slate-600 border-slate-200";
        let badgeText = "전고점 미달";
        let barColor = "bg-slate-400";

        if (ratio >= 100) {
          badgeClass = "bg-rose-100 text-rose-700 border-rose-300 font-bold animate-pulse";
          badgeText = `👑 2020~22 전고점 돌파 (${ratio.toFixed(1)}%)`;
          barColor = "bg-rose-500";
        } else if (ratio >= 90) {
          badgeClass = "bg-amber-100 text-amber-800 border-amber-300 font-bold";
          badgeText = `🔥 전고점 턱밑 추격 (${ratio.toFixed(1)}%)`;
          barColor = "bg-amber-500";
        } else if (ratio > 0) {
          badgeClass = "bg-indigo-50 text-indigo-700 border-indigo-200";
          badgeText = `2020~22 전고점 대비 ${ratio.toFixed(1)}%`;
          barColor = "bg-indigo-500";
        }

        const displayRatio = ratio > 0 ? Math.min(ratio, 100) : 0;

        return `
          <div onclick="openModal('${encodeURIComponent(JSON.stringify(item))}')" 
               class="glass-card p-5 rounded-2xl shadow-sm hover:shadow-md transition-all cursor-pointer border border-slate-200/80 hover:border-indigo-300 relative overflow-hidden group">
            
            <div class="flex justify-between items-start gap-2 mb-2">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200">${item.regionName}</span>
                  <h3 class="text-base font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">${item.aptName}</h3>
                </div>
                <div class="text-xs text-slate-400 mt-1">전용 ${item.area}㎡ (${item.intArea}㎡ 타입) · ${item.floor}</div>
              </div>
              <div class="text-right">
                <div class="text-lg font-black text-indigo-600">${item.price} 억</div>
                <div class="text-[10px] text-slate-400">${item.tradeDate}</div>
              </div>
            </div>

            <!-- Recovery Gauge Bar -->
            ${item.athPrice ? `
            <div class="mt-3 pt-3 border-t border-slate-100">
              <div class="flex justify-between items-center text-xs mb-1.5">
                <span class="inline-flex items-center gap-1 border px-2 py-0.5 rounded-full text-[11px] ${badgeClass}">
                  ${badgeText}
                </span>
                <span class="text-slate-500 text-[11px]">
                  2020~22 peak: <strong class="text-slate-800">${item.athPrice.toFixed(2)}억</strong> (${item.athDate})
                </span>
              </div>
              <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="${barColor} h-full transition-all duration-500" style="width: ${displayRatio}%"></div>
              </div>
            </div>
            ` : `
            <div class="mt-2 text-[11px] text-slate-400 italic">2020~2022 벤치마크 미등록 단지</div>
            `}

          </div>
        `;
      }).join('');
    }

    // 8. Render Regional Pie Chart
    function renderChart(mData) {
      const ctx = document.getElementById('regionChart').getContext('2d');
      if (regionChartObj) regionChartObj.destroy();

      const seoulPct = mData.seoulPercent || 50;
      const gyeonggiPct = mData.gyeonggiPercent || 50;

      regionChartObj = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['서울 권역', '경기 핵심권역'],
          datasets: [{
            data: [seoulPct, gyeonggiPct],
            backgroundColor: ['#6366f1', '#10b981'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
          },
          cutout: '70%'
        }
      });
    }

    // 9. Modal Control
    function openModal(jsonStr) {
      const item = JSON.parse(decodeURIComponent(jsonStr));
      const modal = document.getElementById("detail-modal");
      const content = document.getElementById("modal-content");

      const gap = item.athPrice ? (item.price - item.athPrice).toFixed(2) : null;
      const gapText = gap !== null 
        ? (gap >= 0 ? `<span class="text-rose-600 font-bold">+${gap}억 (전고점 초과)</span>` : `<span class="text-indigo-600 font-bold">${gap}억 (격차 존재)</span>`)
        : '-';

      content.innerHTML = `
        <div class="space-y-4">
          <div class="border-b border-slate-100 pb-3">
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${item.regionName}</span>
            <h3 class="text-xl font-bold text-slate-900 mt-1">${item.aptName}</h3>
            <p class="text-xs text-slate-400">전용면적 ${item.area}㎡ (${item.intArea}㎡ 타입) · ${item.floor}</p>
          </div>

          <div class="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs">
            <div>
              <div class="text-slate-400">이번 달 실거래가</div>
              <div class="text-lg font-black text-indigo-600 mt-0.5">${item.price} 억</div>
              <div class="text-[10px] text-slate-400">${item.tradeDate} 체결</div>
            </div>
            <div>
              <div class="text-slate-400">2020~2022 불장 전고점</div>
              <div class="text-lg font-black text-slate-800 mt-0.5">${item.athPrice ? item.athPrice.toFixed(2) + ' 억' : '기록 없음'}</div>
              <div class="text-[10px] text-slate-400">${item.athDate} (${item.athFloor || '중층'})</div>
            </div>
          </div>

          <div class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100 text-xs space-y-2">
            <div class="flex justify-between">
              <span class="text-slate-500">2020~22 peak 대비 회복률</span>
              <strong class="text-indigo-700">${item.recoveryRatio ? item.recoveryRatio.toFixed(1) + '%' : '-'}</strong>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">전고점 대비 격차(Gap)</span>
              <span>${gapText}</span>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-colors">
            닫기
          </button>
        </div>
      `;

      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.add("hidden");
    }

    // Search input listener
    document.getElementById("search-input").addEventListener("input", () => {
      renderData();
    });

    // Start App
    window.onload = init;
  </script>
</body>
</html>
